<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Themenseiten-Check</title>
<style>
:root{--ink:#1b2f5b;--paper:#f7f9fc;--line:#d9dfea;--muted:#5d6678;--card:#fff;
--keep:#2e7d5b;--drop:#b4432f;--accent:#2756a8;--lane:#eef2f9;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#dfe7f7;--paper:#0f1828;--line:#2c3a55;
--muted:#9aa6bd;--card:#16223a;--keep:#6cc59b;--drop:#ef8a75;--accent:#8fb2f0;--lane:#132036;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{max-width:76rem;margin:auto;padding:0 1.25rem}
form{padding:1.5rem 0 1rem;border-bottom:1px solid var(--line)}
.ask{display:flex;gap:.5rem}
.ask input{flex:1;min-width:0;font:inherit;padding:.6rem .8rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{font:inherit;font-weight:600;padding:.6rem 1.2rem;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0f1828}}
button:disabled{opacity:.6;cursor:wait}
.opts{display:flex;flex-wrap:wrap;gap:.4rem 1.25rem;margin-top:.75rem;color:var(--muted);font-size:.9rem}
.opts label{display:flex;gap:.35rem;align-items:center}
select,.opts input[type=password]{font:inherit;padding:.2rem .4rem;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)}
.examples{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.75rem;color:var(--muted);font-size:.9rem}
.examples button{background:var(--card);color:var(--accent);border:1px solid var(--accent);font-weight:600;font-size:.85rem;padding:.3rem .7rem}
.used{display:inline-block;font-size:.75rem;color:var(--keep);border:1px solid var(--keep);border-radius:3px;padding:0 .35rem;margin-left:.4rem;vertical-align:middle}
.history{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.75rem}
.history button{background:var(--lane);color:var(--ink);font-weight:400;font-size:.85rem;padding:.25rem .6rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{padding:1rem 0;color:var(--muted)}
.status.error{color:var(--drop)}
.choices{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
form.find{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:.9rem}
form.find input{font:inherit;padding:.4rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
form.find input#q{flex:1;min-width:10rem}
form.find button{padding:.4rem .9rem}
#results ul{list-style:none;margin:.5rem 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.5rem}
#results li button{width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:400;padding:.5rem .7rem}
#results li strong{display:block}
.tag{display:inline-block;font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 .35rem;margin:.25rem .25rem 0 0}
.tag.yes{color:var(--keep);border-color:var(--keep)}
details.comp{max-width:48rem;margin:0 0 .75rem}
details.comp summary{cursor:pointer;color:var(--muted)}
details.comp p{white-space:pre-line;margin:.4rem 0 0;border-left:3px solid var(--ink);padding:.2rem 0 .2rem 1rem}
header.topic{padding:2rem 0 1rem}
h1{font:600 2rem/1.2 Georgia,"Times New Roman",serif;margin:0 0 .75rem}
h1 a{color:inherit;text-underline-offset:.2em;text-decoration-thickness:1px}
.small{color:var(--muted);font-size:.9rem;margin:.25rem 0}
.cut{display:flex;align-items:center;gap:.75rem;margin:1rem 0 0;flex-wrap:wrap}
.cut input{width:14rem;accent-color:var(--accent)}
.cut strong{font-variant-numeric:tabular-nums}
.notes{margin:.75rem 0 0;padding-left:1.2rem;color:var(--muted);font-size:.9rem}
section.lane{background:var(--lane);border-radius:8px;padding:1rem 1rem .5rem;margin:1.25rem 0}
.lane h2{font:600 1.2rem/1.3 Georgia,serif;margin:0}
.kind{font:400 .8rem/1 "Segoe UI",system-ui,sans-serif;color:var(--muted);margin-left:.5rem}
.widgets{margin:.3rem 0 .75rem;padding:0;list-style:none;color:var(--muted);font-size:.85rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:52rem){.cols{grid-template-columns:1fr}}
h3{font-size:.95rem;margin:0 0 .4rem}
ol{list-style:none;margin:0 0 .5rem;padding:0}
li.m{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--keep);border-radius:6px;padding:.45rem .7rem;margin-bottom:.4rem}
li.m.drop{border-left-color:var(--drop)}
li.m.drop .t{text-decoration:line-through;text-decoration-color:var(--drop)}
.row{display:flex;gap:.5rem;align-items:baseline}
.t{flex:1;font-weight:600}
.t a{color:inherit}
.sc{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.mv{font-size:.8rem;font-variant-numeric:tabular-nums}.up{color:var(--keep)}.dn{color:var(--drop)}
.bar{position:relative;height:4px;background:var(--line);border-radius:2px;margin-top:.35rem}
.bar span{display:block;height:100%;border-radius:2px;background:var(--keep)}
li.drop .bar span{background:var(--drop)}
.bar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
details.d{font-size:.85rem;color:var(--muted);margin-top:.25rem;white-space:pre-line}
details.d summary{cursor:pointer}
details.out>summary{cursor:pointer;font-weight:600;font-size:.95rem;margin:.25rem 0 .5rem}
.empty{color:var(--muted);font-style:italic;font-size:.9rem;margin:0 0 .75rem}
footer{color:var(--muted);font-size:.85rem;padding:2rem 0}
</style>
</head>
<body>
<div class="wrap">
<form id="f">
  <div class="ask">
    <input id="url" type="text" required value="https://wordpress.staging.openeduhub.net/portal/physik-optik/" placeholder="URL der Themenseite oder Sammlungs-ID" aria-label="URL der Themenseite">
    <button id="go" type="submit">Prüfen</button>
  </div>
  <div class="examples" aria-label="Beispiele">
    <span>Beispiele:</span>
    <button type="button" data-url="https://wordpress.staging.openeduhub.net/portal/physik-optik/">Physik: Optik</button>
    <button type="button" data-url="https://wordpress.staging.openeduhub.net/portal/mathematik-r%c3%a4umliche-und-ebene-geometrie/">Mathematik: Räumliche und ebene Geometrie</button>
    <button type="button" data-url="https://wordpress.staging.openeduhub.net/portal/informatik-technische-informatik/">Informatik: Technische Informatik</button>
  </div>
  <div class="opts">
    <label>Abgleich mit
      <select id="topictext">
        <option value="description" selected>Beschreibung der Themenseite</option>
        <option value="compendium">kompendialem Text</option>
        <option value="both">beidem</option>
      </select></label>
    <label><input type="checkbox" id="searches" checked> gespeicherte Suchen annähern</label>
    <label><input type="checkbox" id="subs" checked> Unterthemen einbeziehen</label>
    <label id="pwbox" hidden>Passwort <input type="password" id="pw" autocomplete="current-password"></label>
  </div>
  <div class="history" id="history" aria-label="Zuletzt geprüft"></div>
</form>
<form id="sf" class="find">
  <span>Oder Themenseite suchen</span>
  <input id="q" type="text" required placeholder="Thema, z. B. Optik" aria-label="Thema">
  <input id="subject" type="text" placeholder="Fach (optional)" aria-label="Fach">
  <button type="submit" id="sgo">Suchen</button>
</form>
<div id="results"></div>
<div id="status" class="status" role="status"></div>
<div id="out"></div>
<footer>Liest nur, schreibt nichts. Die Schwelle verschiebt sich im Browser, ohne neu zu bewerten.</footer>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const HISTORY_KEY = "themenseiten-check:history";
let data = null;

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}
function link(text, url) {
  return /^https?:\/\//.test(url || "")
    ? el("a", {href: url, target: "_blank", rel: "noopener"}, text) : document.createTextNode(text);
}

function readHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
}
function remember(url, title) {
  const list = [{url, title}, ...readHistory().filter(h => h.url !== url)].slice(0, 8);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch {}
  drawHistory();
}
function drawHistory() {
  const box = $("history");
  box.replaceChildren(...readHistory().map(h => {
    const b = el("button", {type: "button", title: h.url}, h.title);
    b.onclick = () => { $("url").value = h.url; $("f").requestSubmit(); };
    return b;
  }));
}

function entry(id, rank, cut, moved) {
  const m = data.items[id];
  const keep = m.score >= cut;
  const row = el("div", {class: "row"}, el("span", {class: "t"}, link(m.title, m.url)));
  if (moved !== undefined && moved !== 0) {
    row.append(el("span", {class: "mv " + (moved > 0 ? "up" : "dn"), title: "Platzänderung in dieser Schwimmlinie"},
      (moved > 0 ? "▲" : "▼") + Math.abs(moved)));
  }
  row.append(el("span", {class: "sc"}, m.score.toFixed(2)));
  const bar = el("div", {class: "bar"},
    el("span", {style: `width:${Math.round(Math.min(1, Math.max(0, m.score)) * 100)}%`}),
    el("i", {style: `left:${Math.round(cut * 100)}%`, title: "Schwelle"}));
  const li = el("li", {class: "m" + (keep ? "" : " drop")}, row, bar);
  const extra = [m.subjects.length ? "Fach: " + m.subjects.join(", ") : null, m.description || null,
                 m.keywords.length ? "Schlagworte: " + m.keywords.join(", ") : null].filter(Boolean);
  if (extra.length) li.append(el("details", {class: "d"}, el("summary", {}, "Details"), extra.join("\n\n")));
  return li;
}

function lane(l, cut) {
  const ids = l.item_ids;
  const ranked = [...ids].sort((a, b) => data.items[b].score - data.items[a].score || ids.indexOf(a) - ids.indexOf(b));
  const kept = ranked.filter(id => data.items[id].score >= cut);
  const dropped = ids.filter(id => data.items[id].score < cut);
  const kinds = {seite: "Schwimmlinie", sammlung: "direkt zugeordnet", untersammlung: "Untersammlung"};

  const sec = el("section", {class: "lane"},
    el("h2", {}, l.heading, el("span", {class: "kind"}, kinds[l.kind] || l.kind)));
  sec.append(el("ul", {class: "widgets"}, ...l.widgets.map(w => el("li", {}, w))));
  if (!ids.length) { sec.append(el("p", {class: "empty"}, "Keine bewertbaren Inhalte in dieser Schwimmlinie.")); return sec; }

  const before = el("div", {}, el("h3", {}, `Ist-Stand (${ids.length})`),
    el("ol", {}, ...ids.map((id, i) => entry(id, i + 1, cut))));
  const after = el("div", {}, el("h3", {}, `Nach Reranking (${kept.length})`),
    kept.length ? el("ol", {}, ...kept.map((id, i) => entry(id, i + 1, cut, ids.indexOf(id) - i)))
                : el("p", {class: "empty"}, "Nichts erreicht die Schwelle."));
  if (dropped.length) {
    after.append(el("details", {class: "out"}, el("summary", {}, `Aussortiert (${dropped.length})`),
      el("ol", {}, ...dropped.map((id, i) => entry(id, i + 1, cut)))));
  }
  sec.append(el("div", {class: "cols"}, before, after));
  return sec;
}

const TEXT_NAMES = {description: "Beschreibung", compendium: "kompendialer Text"};

// Both texts are shown; the one the materials were measured against is marked
// and open, the other folded -- the compendium can run to many paragraphs.
function topicTexts(t, choice) {
  const used = choice.used === "both" ? ["description", "compendium"] : [choice.used];
  const out = [];
  if (choice.used !== choice.chosen && choice.chosen !== "both") {
    out.push(el("p", {class: "small"},
      `Kein Text „${TEXT_NAMES[choice.chosen]}“ hinterlegt – ` +
      (choice.used === "none" ? "gemessen wird nur an Titel und Schlagworten."
                              : `stattdessen ${TEXT_NAMES[choice.used] || "beides"} genutzt.`)));
  }
  for (const key of ["description", "compendium"]) {
    const text = t[key];
    const mark = used.includes(key) ? el("span", {class: "used"}, "für den Abgleich genutzt") : null;
    if (!text) { out.push(el("p", {class: "small"}, `Kein Text „${TEXT_NAMES[key]}“ hinterlegt.`)); continue; }
    const attrs = {class: "comp"};
    if (used.includes(key)) attrs.open = "";
    out.push(el("details", attrs, el("summary", {}, key === "description" ? "Beschreibung" : "Kompendialer Text", mark),
                el("p", {}, text)));
  }
  return out;
}

function draw() {
  const cut = Number($("cut")?.value ?? data.threshold);
  const t = data.topic;
  const all = Object.values(data.items);
  const misfits = all.filter(m => m.score < cut).length;

  const slider = el("input", {type: "range", id: "cut", min: "0", max: "1", step: "0.01", value: String(cut),
                              "aria-label": "Schwelle für passend"});
  slider.oninput = draw;
  const head = el("header", {class: "topic"},
    el("h1", {}, link(t.title, t.url)),
    ...topicTexts(t, data.topic_text),
    t.keywords.length ? el("p", {class: "small"}, "Schlagworte: " + t.keywords.join(", ")) : null,
    el("div", {class: "cut"}, el("span", {}, el("strong", {}, `${misfits} von ${all.length}`), " Inhalten passen nicht zum Thema"),
      el("label", {}, "Schwelle ", slider, " ", el("strong", {}, cut.toFixed(2)))),
    el("p", {class: "small"}, `Bewertet mit ${data.backend}. Quelle: ${data.repository}.`));
  if (data.notes.length) head.append(el("ul", {class: "notes"}, ...data.notes.map(n => el("li", {}, n))));

  const focused = document.activeElement?.id === "cut";
  $("out").replaceChildren(head, ...data.lanes.map(l => lane(l, cut)));
  if (focused) $("cut").focus();
}

function offerChoices(message, choices, original) {
  $("status").className = "status";
  $("status").replaceChildren(message + " Welche ist gemeint?",
    el("div", {class: "choices"}, ...choices.map(c => {
      const b = el("button", {type: "button", title: c.id}, c.title);
      b.onclick = () => run(c.id, original);
      return b;
    })));
}

$("f").onsubmit = ev => { ev.preventDefault(); run($("url").value.trim()); };
for (const b of document.querySelectorAll(".examples button")) {
  b.onclick = () => { $("url").value = b.dataset.url; run(b.dataset.url); };
}

function mark(value, yes, no) {
  if (value === null || value === undefined) return el("span", {class: "tag", title: "Dieser Treffer kam ohne Eigenschaften – unbekannt"}, yes + " ?");
  return el("span", {class: "tag" + (value ? " yes" : "")}, value ? yes : no);
}

$("sf").onsubmit = async ev => {
  ev.preventDefault();
  $("sgo").disabled = true;
  $("results").replaceChildren(el("p", {class: "status"}, "Suche läuft …"));
  try {
    const res = await fetch("/api/search", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-Demo-Password": $("pw").value},
      body: JSON.stringify({text: $("q").value.trim(), subject: $("subject").value.trim()}),
    });
    const body = await res.json().catch(() => ({error: `Antwort ohne JSON (HTTP ${res.status}).`}));
    if (res.status === 401) $("pwbox").hidden = false;
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    const notes = body.unresolved.map(u => el("p", {class: "status error"},
      `Fach „${u.value}“ unbekannt, Filter nicht angewandt` +
      (u.suggestions?.length ? ` – gemeint vielleicht: ${u.suggestions.join(", ")}` : "") + "."));
    const items = body.hits.map(h => {
      const b = el("button", {type: "button", title: h.id}, el("strong", {}, h.title),
        mark(h.has_compendium, "Kompendientext", "kein Kompendientext"),
        mark(h.has_layout, "Seitenlayout", "kein Seitenlayout"));
      b.onclick = () => { $("url").value = h.id; run(h.id); };
      return el("li", {}, b);
    });
    $("results").replaceChildren(...notes,
      items.length ? el("ul", {}, ...items) : el("p", {class: "status"}, "Keine Sammlung gefunden."),
      ...(body.warnings || []).map(w => el("p", {class: "small"}, w)));
  } catch (err) {
    $("results").replaceChildren(el("p", {class: "status error"}, err.message));
  } finally {
    $("sgo").disabled = false;
  }
};

async function run(url, label = url) {
  $("go").disabled = true;
  $("status").className = "status";
  $("status").textContent = "Themenseite wird gelesen und bewertet …";
  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-Demo-Password": $("pw").value},
      body: JSON.stringify({url, topic_text: $("topictext").value, subcollections: $("subs").checked,
                            run_searches: $("searches").checked}),
    });
    const body = await res.json().catch(() => ({error: `Antwort ohne JSON (HTTP ${res.status}).`}));
    if (res.status === 401) $("pwbox").hidden = false;
    if (res.status === 409 && body.choices) { offerChoices(body.error, body.choices, label); return; }
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    data = body;
    $("status").textContent = "";
    $("out").replaceChildren();  // new page: start from the default threshold
    draw();
    // A chosen candidate is remembered by its id: the portal URL alone stays ambiguous.
    remember(url, data.topic.title);
  } catch (err) {
    $("status").className = "status error";
    $("status").textContent = err.message;
  } finally {
    $("go").disabled = false;
  }
}
drawHistory();

fetch("/api/config").then(r => r.json()).then(cfg => {
  if (cfg.password) $("pwbox").hidden = false;
}).catch(() => {});
</script>
</body>
</html>
